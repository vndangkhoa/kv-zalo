# ==============================================================================
# KV Zalo Web (`kv-zalo-web`) — Zero-Server-Persistence Docker Compose
# ==============================================================================
#
# Quick start:
#   docker compose up -d
#   # Optional shared edge passphrase:
#   KVZALO_WEB_TOKEN="your-secret-passphrase" docker compose up -d
#
# Zero-persistence guarantee:
#   `kv-zalo-web` runs with `read_only: true`, `cap_drop: [ALL]`, `no-new-privileges`,
#   `core: 0`, and ZERO volumes or writable directories. All login cookies (`zpw_sek`),
#   vault keys, OPFS files, and chat history stay 100% inside your browser.
# ==============================================================================

services:
  kv-zalo-web:
    image: vndangkhoa/kv-zalo:latest
    container_name: kv-zalo-web
    build:
      context: .
      dockerfile: Dockerfile
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
    environment:
      KVZALO_WEB_LISTEN: "0.0.0.0:8080"
      KVZALO_ASAR_PATH: "/opt/kv-zalo/app.asar"
      KVZALO_WEB_TOKEN: "${KVZALO_WEB_TOKEN:-${OLAZ_WEB_TOKEN:-}}"
      RUST_LOG: "${RUST_LOG:-info}"
    ports:
      - "${KVZALO_WEB_BIND:-${OLAZ_WEB_BIND:-127.0.0.1:8080}}:8080"
    restart: unless-stopped
